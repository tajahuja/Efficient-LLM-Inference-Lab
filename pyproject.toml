[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-llm-inference-lab"
version = "0.1.0"
description = "Reproducible CPU microbenchmarks for autoregressive Transformer inference"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Taj Ahuja"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
inference-lab = "inference_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
